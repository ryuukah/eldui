<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Request</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="window">

    <!-- TOP WINDOW BAR -->
    <div class="title-bar">

      <div class="heart">♡</div>

      <div class="window-buttons">
        <button class="window-button minimize">—</button>
        <button class="window-button maximize">□</button>
        <button class="window-button close">×</button>
      </div>

    </div>


    <div class="window-content">

      <!-- HEADER -->
      <div class="header">

        <div class="request-title">
          Friend Request
        </div>

        <div class="search-box">
          <span>⌕</span>
        </div>

      </div>


      <!-- MAIN CONTENT -->
      <div class="main-content">

        <!-- DEQUU USER BADGE -->
        <div
          class="profile"
          id="profile"
          aria-label="dequu profile"
        >

          <div class="avatar">
            <img
              src="dequu.png"
              alt="dequu avatar"
              draggable="false"
            >
          </div>

          <span>dequu.jpg</span>

        </div>


        <!-- MESSAGE -->
        <div class="message" id="message">

          <p>( ♥ ) &nbsp; graphic designer</p>
          <p>(99%) interests match</p>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

          <button
            id="acceptBtn"
            class="action accept"
          >
            accept &lt;3
          </button>

          <button
            id="declineBtn"
            class="action decline"
          >
            decline :(
          </button>

        </div>

      </div>


      <!-- BOTTOM PINK AREA -->
      <div class="bottom-bar"></div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
